# Local development: MongoDB + API + web client, all with live reload.
#   docker compose up --build
#   docker compose exec server npm run seed      (demo data)
# Web: http://localhost:5173   API: http://localhost:5000
# Ports clash with something else? Set MONGO_PORT / SERVER_PORT / CLIENT_PORT in a .env file next to this one.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
      target: dev
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URL: mongodb://mongo:27017/studycircle
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-in-production}
      CLIENT_ORIGIN: http://localhost:${CLIENT_PORT:-5173}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${SERVER_PORT:-5000}:5000"
    volumes:
      - ./server/src:/app/src
      - uploads:/app/uploads

  client:
    build:
      context: ./client
      target: dev
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:${SERVER_PORT:-5000}
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html

volumes:
  mongo-data:
  uploads:
